name: Architecture Readiness Assessment CI & Golden Dataset Eval

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  GOOGLE_GENAI_USE_VERTEXAI: "true"
  GOOGLE_GENAI_USE_ENTERPRISE: "true"
  GOOGLE_CLOUD_PROJECT: "ai-readiness-assessor"
  GOOGLE_CLOUD_PROJECT_NUMBER: "123456789012"
  GOOGLE_CLOUD_LOCATION: "us-central1"
  OFFLINE_SANDBOX_MODE: "1"

jobs:
  test-and-evaluate:
    name: Pytest Unit, Guardrails & Golden Dataset Eval
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Authenticate to Google Cloud (Optional Workload Identity)
        if: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Run Layer 1 Unit & Layer 2 Golden Dataset Pytest Suite
        run: |
          pytest -v --tb=short

      - name: Run CLI Smoke Test
        run: |
          python cli.py --preset good

  terraform-validate:
    name: Terraform IaC Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform Format Check & Validate
        working-directory: ./terraform
        run: |
          terraform init -backend=false
          terraform fmt -check
          terraform validate
